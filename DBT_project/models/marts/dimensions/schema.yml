version: 2

models:

  - name: dim_developers
    description: "Conformed dimension for app developers."
    columns:
      - name: developer_key
        description: "Surrogate key (hashed from developer_name)."
        tests:
          - unique
          - not_null
      - name: developer_name
        description: "Developer or company name."
        tests:
          - not_null

  - name: dim_categories
    description: "Conformed dimension for app categories."
    columns:
      - name: category_key
        description: "Surrogate key (hashed from category_name)."
        tests:
          - unique
          - not_null
      - name: category_name
        description: "Category label (e.g., Games, Tools)."
        tests:
          - unique
          - not_null

  - name: dim_apps
    description: "Conformed dimension for apps. References dim_categories and dim_developers."
    columns:
      - name: app_key
        description: "Surrogate key (hashed from app_id)."
        tests:
          - unique
          - not_null
      - name: app_id
        description: "Original Play Store app identifier."
        tests:
          - unique
          - not_null
      - name: app_name
        description: "Display name of the app."
        tests:
          - not_null
      - name: category_key
        description: "Foreign key to dim_categories — referential integrity test."
        tests:
          - not_null
          - relationships:
              to: ref('dim_categories')
              field: category_key
      - name: developer_key
        description: "Foreign key to dim_developers — referential integrity test."
        tests:
          - not_null
          - relationships:
              to: ref('dim_developers')
              field: developer_key

  - name: dim_date
    description: "Conformed date dimension. Covers the full range of review dates."
    columns:
      - name: date_key
        description: "Integer key in YYYYMMDD format (Kimball standard)."
        tests:
          - unique
          - not_null
      - name: date
        description: "Calendar date."
        tests:
          - unique
          - not_null
      - name: year
        description: "Year number."
        tests:
          - not_null
      - name: month
        description: "Month number (1-12)."
        tests:
          - not_null
      - name: quarter
        description: "Quarter number (1-4)."
        tests:
          - not_null
      - name: day_of_week
        description: "Day of week (0=Sunday, 6=Saturday in DuckDB)."
        tests:
          - not_null
      - name: is_weekend
        description: "True if Saturday or Sunday."
        tests:
          - not_null